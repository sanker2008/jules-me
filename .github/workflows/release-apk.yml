name: Build and Release Android Packages

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Validate JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run validate:release

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Export web application
        run: npm run export:web

      - name: Validate Expo project health
        run: npx --yes expo-doctor@latest

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  build-apk:
    name: Build APK (${{ matrix.abi }})
    needs: quality
    environment: android-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run validate:release

      - name: Restore app-signing keystore
        env:
          ANDROID_APP_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_APP_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_APP_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_APP_SIGNING_KEY_ALIAS }}
          ANDROID_APP_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEY_PASSWORD }}
          ANDROID_APP_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_APP_SIGNING_CERT_SHA256 }}
        run: |
          missing=()
          for name in ANDROID_APP_SIGNING_KEYSTORE_BASE64 ANDROID_APP_SIGNING_KEYSTORE_PASSWORD ANDROID_APP_SIGNING_KEY_ALIAS ANDROID_APP_SIGNING_KEY_PASSWORD ANDROID_APP_SIGNING_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required Android app-signing secrets: ${missing[*]}" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_APP_SIGNING_KEYSTORE_BASE64" | base64 --decode > app-signing.keystore
          test -s app-signing.keystore
          chmod 600 app-signing.keystore

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Configure Gradle memory
        run: |
          {
            echo ''
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
            echo 'org.gradle.parallel=true'
            echo 'org.gradle.daemon=false'
          } >> android/gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app-signing.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_APP_SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEY_PASSWORD }}
        run: >-
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=${{ matrix.abi }}
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          -Pexpo.useLegacyPackaging=true

      - name: Verify APK release certificate
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_APP_SIGNING_CERT_SHA256 }}
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "apksigner was not found in the Android SDK" >&2
            exit 1
          fi
          verification="$($apksigner_path verify --verbose --print-certs "$apk")"
          printf '%s\n' "$verification"
          actual_sha256="$(printf '%s\n' "$verification" | node scripts/extract-apksigner-sha256.cjs)"
          expected_sha256="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          debug_sha256='FAC61745DC0903786FB9EDE62A962B399F7348F0BB6F899B8332667591033B9C'
          if [ -z "$actual_sha256" ]; then
            echo "Unable to read the APK signer certificate" >&2
            exit 1
          fi
          if [ "$actual_sha256" = "$debug_sha256" ]; then
            echo "Release APK is signed with the forbidden Android debug certificate" >&2
            exit 1
          fi
          if [ -z "$expected_sha256" ]; then
            echo "ANDROID_APP_SIGNING_CERT_SHA256 is required" >&2
            exit 1
          fi
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "APK signer certificate does not match ANDROID_APP_SIGNING_CERT_SHA256" >&2
            exit 1
          fi

      - name: Name APK
        env:
          ABI: ${{ matrix.abi }}
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/JulesMe-v${version}-${ABI}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JulesMe-${{ matrix.abi }}-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build-aab:
    name: Build Android App Bundle
    needs: quality
    environment: android-release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run validate:release

      - name: Restore upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          missing=()
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD ANDROID_UPLOAD_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required Android upload-signing secrets: ${missing[*]}" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > upload.keystore
          test -s upload.keystore
          chmod 600 upload.keystore

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Configure Gradle memory
        run: |
          {
            echo ''
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
            echo 'org.gradle.parallel=true'
            echo 'org.gradle.daemon=false'
          } >> android/gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: >-
          ./gradlew bundleRelease --no-daemon
          -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          -Pexpo.useLegacyPackaging=false

      - name: Verify AAB release certificate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          verification="$(jarsigner -verify -strict -certs -keystore upload.keystore -storepass:env ANDROID_KEYSTORE_PASSWORD "$aab")"
          printf '%s\n' "$verification"
          certificate="$(keytool -printcert -jarfile "$aab")"
          printf '%s\n' "$certificate"
          actual_sha256="$(printf '%s\n' "$certificate" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected_sha256="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          debug_sha256='FAC61745DC0903786FB9EDE62A962B399F7348F0BB6F899B8332667591033B9C'
          if [ -z "$actual_sha256" ]; then
            echo "Unable to read the AAB signer certificate" >&2
            exit 1
          fi
          if [ "$actual_sha256" = "$debug_sha256" ]; then
            echo "Release AAB is signed with the forbidden Android debug certificate" >&2
            exit 1
          fi
          if [ -z "$expected_sha256" ]; then
            echo "ANDROID_UPLOAD_CERT_SHA256 is required" >&2
            exit 1
          fi
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "AAB signer certificate does not match ANDROID_UPLOAD_CERT_SHA256" >&2
            exit 1
          fi

      - name: Name AAB
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "dist/JulesMe-v${version}.aab"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: JulesMe-aab-${{ github.run_number }}
          path: dist/*.aab
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-apk
      - build-aab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download all Android packages
        uses: actions/download-artifact@v4
        with:
          pattern: JulesMe-*-${{ github.run_number }}
          path: release-assets
          merge-multiple: true

      - name: Publish packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
